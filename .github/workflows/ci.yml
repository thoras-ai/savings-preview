name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the minimum version; build and test with its latest patch release.
          go-version: "1.26"
          check-latest: true
          cache: false
      # Each Go job keeps its own build cache: a shared key would hold
      # whichever job saved first, and -race builds differ from plain ones.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go vet ./...

  test:
    name: test ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    env:
      # Packages slow enough to get a job each. The rest job tests every other
      # package, including packages added later.
      OWN_JOB: ./internal/adapters/datadog ./internal/adapters/polling ./internal/compact ./internal/validate
    strategy:
      matrix:
        shard: [1, 2, 3, 4, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ matrix.shard }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      # -count=1 because some tests run the Python validator and the report
      # model, which go test does not track as inputs. The vet job runs every
      # check go test would.
      - name: go test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = rest ]; then
            pkgs=$(go list ./... | grep -vxF "$(go list $OWN_JOB)")
          else
            pkgs=$(echo $OWN_JOB | cut -d' ' -f"$SHARD")
          fi
          go test -count=1 -vet=off $pkgs

  # The race detector makes the suite several times slower, so it runs on
  # main, nightly and before a release rather than on every pull request.
  race:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
      - run: go test -race -count=1 ./...

  report-and-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Generate the demo cluster sample
        run: go run ./scripts/gen_demo
      - name: Contract and report build tests
        run: python3 -m unittest discover -s tests
      - name: Report page tests
        run: node --test 'tests/**/*.test.js'
      - name: Validate the fixtures against the contract
        run: |
          python3 scripts/validate_contract.py fixtures/savings-preview.otlp.json
          python3 scripts/validate_contract.py fixtures/minikube-poll.otlp.json
          python3 scripts/validate_contract.py fixtures/demo-cluster.compact.otlp.json
