name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # On the runner's disk, the first go command after a restore spends seconds
  # reading the cache; in memory it does not.
  GOCACHE: /dev/shm/go-build
  GOMODCACHE: /dev/shm/go-mod

jobs:
  vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the minimum version; build and test with its latest patch release.
          go-version: "1.26"
          check-latest: true
          cache: false
      # Compiling the dependencies and linking the tests takes minutes, so the
      # vet and test jobs share one build cache, which this job saves on main
      # whenever go.sum or the Go sources change. Other branches and pull
      # requests restore the newest one saved for the same go.sum, or failing
      # that for the same Go version, and rebuild only what changed. The module
      # zips are left out because builds read the extracted sources.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      # go sets a cache entry's mtime to now when it uses the entry, unless the
      # mtime is less than an hour old. Dating the restored entries two hours
      # back lets the next save drop the ones this run did not use, so the
      # cache does not grow with every commit.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-matched-key != ''
        run: find "$GOCACHE" -mindepth 2 -maxdepth 2 -exec touch -m -d '2 hours ago' {} +
      - run: go vet ./...
      # Compiles every test package into the cache, so the test jobs only link and run them.
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        run: go test -vet=off -run '^$' ./...
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-matched-key != ''
        run: find "$GOCACHE" -mindepth 2 -maxdepth 2 -mmin +60 -exec rm -rf {} +
      - if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    name: test ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    env:
      # Packages slow enough to get a job each. The rest job tests every other
      # package, including packages added later.
      OWN_JOB: ./internal/adapters/datadog ./internal/adapters/polling ./internal/compact ./internal/validate
    strategy:
      matrix:
        shard: [1, 2, 3, 4, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      # -count=1 because some tests run the Python validator and the report
      # model, which go test does not track as inputs. The vet job runs every
      # check go test would.
      - name: go test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = rest ]; then
            pkgs=$(go list ./... | grep -vxF "$(go list $OWN_JOB)")
          else
            pkgs=$(echo $OWN_JOB | cut -d' ' -f"$SHARD")
          fi
          go test -count=1 -vet=off $pkgs

  # Fails when the code calls a function with a known vulnerability, in a
  # dependency or in the standard library of the Go release CI uses. A
  # vulnerable package that is imported but not called is listed without
  # failing the job.
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      # The module sources the scan type-checks.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - id: tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /dev/shm/tools
          key: govulncheck-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/go.sum') }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: go build -modfile=tools/go.mod -o /dev/shm/tools/govulncheck golang.org/x/vuln/cmd/govulncheck
      - if: github.ref == 'refs/heads/main' && steps.tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /dev/shm/tools
          key: ${{ steps.tool.outputs.cache-primary-key }}
      # Pull requests use the vulnerability database the nightly run saved
      # that day, so they do not depend on vuln.go.dev answering. Every other
      # run downloads the current one.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: vulndb
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /dev/shm/vulndb
          key: govulndb-${{ steps.day.outputs.day }}
      - if: steps.vulndb.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/vulndb.zip" https://vuln.go.dev/vulndb.zip
          rm -rf /dev/shm/vulndb
          unzip -q "$RUNNER_TEMP/vulndb.zip" -d /dev/shm/vulndb
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /dev/shm/vulndb
          key: govulndb-${{ steps.day.outputs.day }}
      - run: /dev/shm/tools/govulncheck -db file:///dev/shm/vulndb ./...

  # The race detector makes the suite several times slower, so it runs on
  # main, nightly and before a release rather than on every pull request.
  race:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      # -race builds differ from plain ones, so this job keeps its own cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-race-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-race-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - run: go test -race -count=1 ./...

  report-and-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
          cache: false
      - name: Generate the demo cluster sample
        run: go run ./scripts/gen_demo
      - name: Contract and report build tests
        run: python3 -m unittest discover -s tests
      - name: Report page tests
        run: node --test 'tests/**/*.test.js'
      - name: Validate the fixtures against the contract
        run: |
          python3 scripts/validate_contract.py fixtures/savings-preview.otlp.json
          python3 scripts/validate_contract.py fixtures/minikube-poll.otlp.json
          python3 scripts/validate_contract.py fixtures/demo-cluster.compact.otlp.json
