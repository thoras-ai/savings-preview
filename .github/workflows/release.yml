name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      ci-passed: ${{ steps.ci.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Check that CHANGELOG.md has a section for the tag
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null
      # Looks up CI runs on main for the tagged commit, which run every check
      # the checks job would run. Waits for a run in progress.
      - id: ci
        name: Look up CI on main for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/main_ci_result.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --wait 900 >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    if: needs.preflight.outputs.ci-passed != 'true'
    uses: ./.github/workflows/ci.yml

  # Starts with preflight; publish waits for every other job.
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    env:
      GOCACHE: /dev/shm/go-build
      GOMODCACHE: /dev/shm/go-mod
      PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod names the minimum version; build and test with its latest patch release.
          go-version: ">=1.26.9 <1.27"
          check-latest: true
          cache: false
      # The build cache the CI vet job saves on main, which holds the release
      # binaries' compiled packages. A release only restores it, so nothing
      # built from a tag is saved for later runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - run: scripts/release.sh build "$GITHUB_REF_NAME" "$PLATFORM"
      # Builds the SBOM generator pinned in tools/go.mod with empty caches, so
      # nothing saved by another workflow run goes into it.
      - env:
          GOCACHE: ${{ runner.temp }}/sbom-go-build
          GOMODCACHE: ${{ runner.temp }}/sbom-go-mod
        run: scripts/release.sh package "$GITHUB_REF_NAME" "$PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.cdx.json
          if-no-files-found: error

  # Checks the tagged commit against the vulnerability database as of the tag,
  # whether or not CI on main is reused. Restores caches but never saves one.
  govulncheck:
    runs-on: ubuntu-24.04
    env:
      GOCACHE: /dev/shm/go-build
      GOMODCACHE: /dev/shm/go-mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.26.9 <1.27"
          check-latest: true
          cache: false
      # The module sources the scan type-checks.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /dev/shm/go-build
            /dev/shm/go-mod
            !/dev/shm/go-mod/cache/download/**/*.zip
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - id: tool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /dev/shm/tools
          key: govulncheck-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('tools/go.sum') }}
      - if: steps.tool.outputs.cache-hit != 'true'
        run: go build -modfile=tools/go.mod -o /dev/shm/tools/govulncheck golang.org/x/vuln/cmd/govulncheck
      - name: Download the current vulnerability database
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/vulndb.zip" https://vuln.go.dev/vulndb.zip
          unzip -q "$RUNNER_TEMP/vulndb.zip" -d /dev/shm/vulndb
      - run: /dev/shm/tools/govulncheck -db file:///dev/shm/vulndb ./...

  # Signing and notarization go between build and package, in a job that
  # needs preflight. See docs/releasing.md.

  # Runs when govulncheck passed on the tag and either CI passed on main and
  # the checks job was skipped, or the checks job passed.
  publish:
    needs: [preflight, checks, build, govulncheck]
    if: >-
      !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' &&
      needs.govulncheck.result == 'success' &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.preflight.outputs.ci-passed == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release/
      - run: scripts/release.sh checksums "$GITHUB_REF_NAME"
      - run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > dist/release/notes.md
      # The release stays a draft until the Homebrew formula, which needs the
      # asset URLs, is attached, so a failure never leaves a partial release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/release/notes.md "${prerelease[@]}" \
            dist/release/*.tar.gz dist/release/*.cdx.json dist/release/install.sh dist/release/checksums.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets > dist/release/release.json
          python3 scripts/homebrew_formula.py "$GITHUB_REF_NAME" \
            dist/release/checksums.txt dist/release/release.json > dist/release/savings-preview.rb
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/release/savings-preview.rb
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Commits the formula to the tap with a deploy key. Skipped for
  # prereleases, and does nothing until the HOMEBREW_TAP_DEPLOY_KEY secret is
  # set. See docs/releasing.md.
  homebrew-tap:
    needs: publish
    # publish runs after checks, which is skipped when CI on main passed, and
    # a job after a skipped one is skipped too unless its if says otherwise.
    if: ${{ !cancelled() && needs.publish.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ -z $DEPLOY_KEY ]]; then
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY is not set; publish the formula to the tap by hand"
            exit 0
          fi
          ssh_dir=$RUNNER_TEMP/tap-ssh
          mkdir -m 700 "$ssh_dir"
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" >"$ssh_dir/key")
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p savings-preview.rb -D "$RUNNER_TEMP"
          scripts/update_tap.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/savings-preview.rb"

  # Publishes packaging/npm at the release's version, a prerelease under the
  # next dist-tag. npm trusts this workflow through trusted publishing (OIDC),
  # so there is no npm token. Does nothing until the package exists on npm.
  # See docs/releasing.md.
  npm:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - working-directory: packaging/npm
        run: |
          name=$(node -p 'require("./package.json").name')
          if ! out=$(npm view "$name" name 2>&1); then
            if [[ $out == *E404* ]]; then
              echo "::notice::$name is not on npm yet; publish it once by hand (docs/releasing.md)"
              exit 0
            fi
            echo "$out"
            exit 1
          fi
          cp ../../LICENSE .
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          args=(--access public)
          if [[ $GITHUB_REF_NAME == *-* ]]; then args+=(--tag next); fi
          npm publish "${args[@]}"
