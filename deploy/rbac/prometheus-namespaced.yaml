# Read-only access for `savings-preview prometheus --target`, limited to one
# port of the one service that serves PromQL. Discovery needs cluster-wide
# access, so pass --target and skip it.
#
# Replace STORE_NAMESPACE and STORE_PROXY_NAME. STORE_PROXY_NAME is the name
# the API server checks for a service proxy request: service:port for HTTP and
# https:service:port for HTTPS, with the port written as in --target. For
# --target monitoring/prometheus-server:9090, use STORE_NAMESPACE monitoring
# and STORE_PROXY_NAME prometheus-server:9090.
# Create the namespace first: kubectl create namespace savings-preview
apiVersion: v1
kind: ServiceAccount
metadata:
  name: savings-preview
  namespace: savings-preview
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: savings-preview-prometheus
  namespace: STORE_NAMESPACE
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["STORE_PROXY_NAME"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: savings-preview-prometheus
  namespace: STORE_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: savings-preview-prometheus
subjects:
  - kind: ServiceAccount
    name: savings-preview
    namespace: savings-preview
