# A token for the savings-preview ServiceAccount that does not expire, for a
# poll that runs longer than a token from `kubectl create token` lasts.
# Delete this Secret to revoke the token.
apiVersion: v1
kind: Secret
metadata:
  name: savings-preview-token
  namespace: savings-preview
  annotations:
    kubernetes.io/service-account.name: savings-preview
type: kubernetes.io/service-account-token
