<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoras Savings Preview</title>
<style>/*{{CSS}}*/</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="wordmark" role="img" aria-label="Thoras"><!--{{WORDMARK}}--></span><span class="product">Savings Preview</span><span id="context" class="context"></span></div>
  <div class="top-tools">
    <button id="copy-link" type="button" class="top-quiet" hidden>Copy link</button>
    <button id="print-summary" type="button" class="top-quiet" hidden>Print summary</button>
    <button id="open-another" type="button" class="top-quiet" hidden>Open another file</button>
    <div id="theme" class="theme" role="radiogroup" aria-label="Theme">
      <button type="button" role="radio" data-theme-choice="auto">Auto</button>
      <button type="button" role="radio" data-theme-choice="light">Light</button>
      <button type="button" role="radio" data-theme-choice="dark">Dark</button>
    </div>
    <a id="book-demo" class="top-cta" href="https://www.thoras.ai/book-a-demo" target="_blank" rel="noopener" hidden>Book a demo</a>
  </div>
</header>
<main>
  <section id="loading" class="panel center" hidden>Loading report data…</section>
  <section id="start" hidden></section>
  <div id="report" hidden></div>
</main>
<div id="print" class="print" data-theme="light"></div>
<script>/*{{JS}}*/</script>
</body>
</html>
